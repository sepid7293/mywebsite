<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وب‌سایت نمونه</title>

  <!-- لینک به CSS بوت‌استرپ -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    footer {
      background-color: #343a40;
      color: white;
      padding: 1rem 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- هدر و ناوبری -->
  <header class="bg-primary text-white p-3 mb-4">
    <div class="container">
      <h1 class="h3">وب‌سایت من</h1>
      <nav class="nav">
        <a class="nav-link text-white" href="#">خانه</a>
        <a class="nav-link text-white" href="#">درباره ما</a>
        <a class="nav-link text-white" href="#">خدمات</a>
        <a class="nav-link text-white" href="#">تماس با ما</a>
      </nav>
    </div>
  </header>

  <!-- محتوای اصلی -->
  <main class="container">
    <section class="mb-5">
      <h2>به وب‌سایت ما خوش آمدید</h2>
      <p>ما اینجا هستیم تا بهترین خدمات طراحی وب را به شما ارائه دهیم.</p>
    </section>

    <section class="row">
      <div class="col-md-4 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">ویژگی اول</h5>
            <p class="card-text">توضیحی درباره این ویژگی.</p>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">ویژگی دوم</h5>
            <p class="card-text">توضیحی درباره این ویژگی.</p>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">ویژگی سوم</h5>
            <p class="card-text">توضیحی درباره این ویژگی.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- فوتر -->
  <footer>
    <div class="container">
      <p>© ۲۰۲۵ - طراحی شده توسط شما</p>
    </div>
  </footer>

  <!-- اسکریپت بوت‌استرپ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
